<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account | Antixorcar.com — Premium Automotive Marketplace</title>
  <meta name="description" content="Register an account with Antixorcar.com to save vehicles, receive price drops, submit enquiries, and manage your vehicle sales.">
  
  <link rel="icon" type="image/svg+xml" href="assets/icons/logo.svg">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with Brand Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              orange: '#F4511E',
              orangeHover: '#D83C0B',
              navy: '#071A2B',
              deepNavy: '#0B2638',
              surface: '#112E44',
              surfaceLight: '#183C56',
              lightBg: '#F5F7F9',
              text: '#17212B',
              muted: '#667085'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            heading: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-[#071A2B] text-brand-text min-h-screen flex flex-col justify-between antialiased">

  <!-- Minimal Transparent Header -->
  <header class="py-6 px-4 sm:px-8 border-b border-white/10">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2.5">
        <svg class="w-8 h-8 flex-shrink-0" width="34" height="34" viewBox="0 0 32 32" fill="none">
          <path d="M16 2L2 30H9.5L12.5 23.5H19.5L22.5 30H30L16 2ZM16 11.5L18.2 18H13.8L16 11.5Z" fill="#F4511E"/>
          <polygon points="12.5,23.5 19.5,23.5 18,20 14,20" fill="#FF7043"/>
        </svg>
        <span class="text-xl font-bold text-white font-sans">Antixorcar.com</span>
      </a>

      <a href="login.html" class="text-xs font-semibold text-gray-300 hover:text-white flex items-center gap-1.5">
        <span>Already have an account?</span>
        <span class="text-brand-orange font-bold hover:underline">Sign In</span>
      </a>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-12 relative">
    
    <div class="absolute w-96 h-96 bg-brand-orange/10 rounded-full blur-3xl pointer-events-none top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <div class="bg-white rounded-3xl p-8 sm:p-10 border border-gray-100 shadow-2xl max-w-lg w-full relative z-10">
      
      <div class="text-center mb-6">
        <span class="text-xs uppercase font-bold text-brand-orange tracking-wider">Join Antixorcar</span>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-brand-navy mt-1">Create Account</h1>
        <p class="text-xs text-gray-500 mt-1">Unlock saved cars, real-time alerts, and instant test drives.</p>
      </div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)" class="space-y-4">
        
        <!-- Name -->
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1.5">Full Name *</label>
          <div class="relative">
            <i class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
            <input 
              id="reg-name" 
              type="text" 
              required 
              placeholder="Alex Johnson" 
              class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-brand-orange transition-colors"
            />
          </div>
        </div>

        <!-- Email & Phone Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5">Email Address *</label>
            <div class="relative">
              <i class="fa-regular fa-envelope absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
              <input 
                id="reg-email" 
                type="email" 
                required 
                placeholder="alex@example.com" 
                class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-brand-orange transition-colors"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5">Phone Number *</label>
            <div class="relative">
              <i class="fa-solid fa-phone absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
              <input 
                id="reg-phone" 
                type="tel" 
                required 
                placeholder="+1 (555) 000-0000" 
                class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-brand-orange transition-colors"
              />
            </div>
          </div>
        </div>

        <!-- Password & Confirm Password -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5">Password *</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
              <input 
                id="reg-pass" 
                type="password" 
                required 
                placeholder="At least 8 chars" 
                minlength="6"
                class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-brand-orange transition-colors"
              />
            </div>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 mb-1.5">Confirm Password *</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
              <input 
                id="reg-pass-confirm" 
                type="password" 
                required 
                placeholder="Repeat password" 
                minlength="6"
                class="w-full pl-9 pr-3.5 py-3 rounded-xl border border-gray-200 text-xs focus:outline-none focus:border-brand-orange transition-colors"
              />
            </div>
          </div>
        </div>

        <!-- Checkbox -->
        <div class="pt-1">
          <label class="flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" required checked class="custom-checkbox rounded text-brand-orange mt-0.5">
            <span class="text-xs text-gray-600 leading-tight">
              I agree to the <a href="about.html" class="text-brand-orange font-semibold hover:underline">Terms of Service</a> and acknowledge the <a href="about.html" class="text-brand-orange font-semibold hover:underline">Privacy Policy</a>.
            </span>
          </label>
        </div>

        <div class="pt-2">
          <button type="submit" class="w-full py-3.5 rounded-xl btn-primary text-xs uppercase tracking-wider font-extrabold shadow-md">
            Complete Registration →
          </button>
        </div>

      </form>

      <p class="text-center text-xs text-gray-500 mt-6">
        Already have an account? 
        <a href="login.html" class="font-bold text-brand-orange hover:underline">Sign In here</a>
      </p>

    </div>
  </main>

  <footer class="py-4 text-center text-xs text-gray-400 border-t border-white/10">
    <p>© 2026 Antixorcar.com. All rights reserved.</p>
  </footer>

  <!-- Bootstrap 5.3.3 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/main.js"></script>
  <script>
    function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pass = document.getElementById('reg-pass').value;
      const passConfirm = document.getElementById('reg-pass-confirm').value;

      if (pass !== passConfirm) {
        window.showToast('Passwords do not match. Please re-enter.', 'warning');
        return;
      }

      const user = {
        isLoggedIn: true,
        name: name,
        email: email,
        phone: phone,
        memberSince: 'October 2026'
      };

      localStorage.setItem('antixor_user', JSON.stringify(user));
      window.showToast(`Account created successfully! Welcome, ${name}.`, 'success');

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 900);
    }
  </script>

</body>
</html>
